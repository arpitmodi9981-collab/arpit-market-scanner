<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arpit Market Scanner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090d14;
  color:#eef3fa;
  font-family:Arial,sans-serif
}

.app{
  max-width:620px;
  margin:auto;
  padding-bottom:30px
}

header{
  padding:20px 16px 10px
}

h1{
  margin:0;
  font-size:23px
}

.sub{
  color:#8995a8;
  font-size:12px;
  margin-top:5px
}

.controls{
  display:flex;
  gap:8px;
  padding:12px 14px
}

select,button{
  background:#182230;
  color:#eef3fa;
  border:1px solid #2b394b;
  border-radius:10px;
  padding:11px;
  font-size:14px
}

select{
  flex:1
}

button{
  cursor:pointer
}

button.active{
  background:#35455c
}

.card{
  margin:10px 14px;
  padding:15px;
  background:#111925;
  border:1px solid #253247;
  border-radius:14px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.label{
  color:#8995a8;
  font-size:12px
}

.price{
  font-size:28px;
  font-weight:bold;
  margin-top:5px
}

.badge{
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  background:#302a18;
  color:#f3c96a
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

.level{
  padding:12px;
  border-radius:10px;
  background:#151f2d
}

.level strong{
  display:block;
  font-size:18px;
  margin-top:5px
}

.status{
  font-size:15px;
  font-weight:bold;
  margin-top:5px
}

.green{color:#61dc96}
.red{color:#ff7070}
.yellow{color:#f3c96a}

.chart{
  height:190px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:12px;
  background:#0b111a;
  border-radius:10px;
  margin-top:10px
}

.bar{
  flex:1;
  max-width:35px;
  min-height:10px;
  border-radius:4px 4px 0 0
}

.up{
  background:#61dc96
}

.down{
  background:#ff7070
}

  padding:10px;
