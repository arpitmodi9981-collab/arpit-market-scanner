<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arpit Market Scanner</title>
<style>
body{margin:0;background:#090d14;color:white;font-family:Arial;padding:15px}
.card{background:#111925;border:1px solid #29364a;border-radius:14px;padding:15px;margin:12px 0}
select,button{background:#182230;color:white;border:1px solid #35445a;border-radius:8px;padding:10px}
button.active{background:#40536d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#182230;padding:12px;border-radius:9px}
.big{font-size:30px;font-weight:bold}
.gray{color:#8995a8;font-size:12px}
.green{color:#61dc96}
.yellow{color:#f3c96a}
#chart{height:150px;display:flex;align-items:end;gap:7px;background:#0b1119;padding:10px}
.bar{flex:1;border-radius:4px 4px 0 0}
.up{background:#61dc96}.down{background:#ff7070}
</style>
</head>

<body>

<h2>Arpit Market Scanner</h2>
<div class="gray">Price-action learning scanner</div>

<div class="card">
<select id="symbol">
<option>NIFTY</option>
<option>BANKNIFTY</option>
<option>MCX CRUDE OIL</option>
</select>
<button id="b5" class="active">5m</button>
<button id="b15">15m</button>
</div>

<div class="card">
<div class="gray">Current Price</div>
<div id="price" class="big">Loading...</div>
</div>

<div class="card">
<div class="gray">Market Structure</div>
<div id="structure" class="green">Loading...</div>
<div class="grid">
<div class="box">Resistance<br><b id="resistance">—</b></div>
<div class="box">Support<br><b id="support">—</b></div>
</div>
</div>

<div class="card">
<div class="gray">Candles</div>
<div id="chart"></div>
</div>

<div class="card">
<div class="gray">Price Action</div>
<div class="grid">
<div class="box">Breakout<br><b id="breakout">—</b></div>
<div class="box">Retest<br><b id="retest">—</b></div>
<div class="box">False Breakout<br><b id="false">—</b></div>
<div class="box">Strength<br><b id="strength">—</b></div>
</div>
</div>

<div class="card">
<div class="gray">Connection</div>
<b id="connection">Connecting...</b>
</div>

<script>
const API="https://arpit-market-scanner-backend.onrender.com";
let tf="5m";

async function load(){
try{
let r=await fetch(API+"/scanner/"+encodeURIComponent(symbol.value)+"?x="+Date.now());
let d=await r.json();

price.textContent=d.price.toLocaleString("en-IN");
structure.textContent=d.priceAction.structure;
resistance.textContent=d.levels.resistance.toLocaleString("en-IN");
support.textContent=d.levels.support.toLocaleString("en-IN");
breakout.textContent=d.priceAction.breakout;
retest.textContent=d.priceAction.retest;
false.textContent=d.priceAction.falseBreakout;
strength.textContent=d.levels.strength;
connection.textContent="Backend connected • Demo data";

draw(d.candles[tf]);
}catch(e){
connection.textContent="Connection error";
console.log(e);
}
}

function draw(c){
chart.innerHTML="";
c.forEach(x=>{
let b=document.createElement("div");
b.className="bar "+(x.close>=x.open?"up":"down");
b.style.height=Math.max(20,(x.high-x.low)*4)+"px";
chart.appendChild(b);
});
}

symbol.onchange=load;

b5.onclick=()=>{
tf="5m";
b5.classList.add("active");
b15.classList.remove("active");
load();
};

b15.onclick=()=>{
tf="15m";
b15.classList.add("active");
b5.classList.remove("active");
load();
};

load();
</script>

</body>
</html>
